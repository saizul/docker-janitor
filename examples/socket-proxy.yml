# Least privilege: talk to Docker through a filtering socket proxy instead of mounting the socket.
# docker-janitor needs to list and delete containers, images, networks and volumes, read
# disk usage (system df) and prune the build cache.
services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      BUILD: 1
      SYSTEM: 1
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      janitor.keep: "true"

  docker-janitor:
    image: ghcr.io/saizul/docker-janitor:latest
    restart: unless-stopped
    depends_on: [socket-proxy]
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
    volumes:
      - janitor-state:/data
    labels:
      janitor.keep: "true"

volumes:
  janitor-state:
