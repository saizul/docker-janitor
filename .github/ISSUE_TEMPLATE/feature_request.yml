name: Feature request
description: Suggest a new policy, protection rule, report or integration
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Config keys or CLI flags you have in mind. How does it stay safe by default?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
